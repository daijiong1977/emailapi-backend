server {
    listen 80;
    server_name emailapi.6ray.com;

    # security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 2m;
    proxy_read_timeout 75s;
    proxy_connect_timeout 5s;

    # optional method guard
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) { return 405; }

    # apply rate limit (requires zone=emailapi added to nginx.conf http block)
    limit_req zone=emailapi burst=20 nodelay;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
